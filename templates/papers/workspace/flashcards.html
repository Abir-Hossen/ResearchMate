{% extends 'papers/workspace/base_workspace.html' %}

{% block workspace_content %}
<div class="card border-0 shadow-sm">
    <div class="card-body">
        <h4 class="h5">Flashcards</h4>
        {% if flashcards %}
            <div class="row g-3">
                {% for card in flashcards %}
                <div class="col-md-6">
                    <div class="border rounded p-3 h-100">
                        <p class="fw-semibold mb-2">{{ card.question }}</p>
                        <p class="text-muted mb-0">{{ card.answer }}</p>
                    </div>
                </div>
                {% endfor %}
            </div>
        {% else %}
            <p class="text-muted mb-0">Run Start Learning to generate flashcards.</p>
        {% endif %}
    </div>
</div>
{% endblock %}
