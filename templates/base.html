<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResearchMate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --research-bg: #f3f7fb;
            --research-surface: #ffffff;
            --research-surface-strong: #eef5ff;
            --research-border: #d9e5f2;
            --research-text: #1f2937;
            --research-muted: #5f6b7a;
            --research-primary: #1f64d8;
            --research-primary-soft: #e8f1ff;
            --research-success: #1f8a5d;
            --research-success-soft: #e7f9f1;
            --research-warning: #b76f00;
            --research-warning-soft: #fff4d9;
            --research-danger: #c73b39;
            --research-danger-soft: #fdecec;
            --research-shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
        }

        body {
            background: var(--research-bg);
            color: var(--research-text);
            font-family: "Segoe UI", Arial, sans-serif;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
        }

        .container-main {
            max-width: 1280px;
        }

        h1, h2, h3, h4, h5, h6 {
            color: #172033;
            letter-spacing: -0.02em;
            margin-bottom: 0.6rem;
        }

        .page-shell {
            padding-top: 2rem;
            padding-bottom: 3rem;
        }

        .page-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .page-header h1,
        .page-header h2,
        .page-header h3 {
            margin-bottom: 0;
        }

        .section-label {
            display: inline-block;
            margin-bottom: 0.5rem;
            font-size: 0.72rem;
            letter-spacing: 0.15em;
            color: var(--research-primary);
            font-weight: 700;
            text-transform: uppercase;
        }

        .card-surface,
        .card {
            border: 1px solid var(--research-border) !important;
            border-radius: 1.1rem !important;
            box-shadow: var(--research-shadow) !important;
        }

        .card {
            background: var(--research-surface);
        }

        .card-body {
            padding: 1.35rem 1.4rem;
        }

        .metric-card {
            height: 100%;
            border-radius: 1rem;
            background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
        }

        .metric-label {
            color: var(--research-muted);
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            margin-bottom: 0.5rem;
        }

        .metric-value {
            font-size: clamp(1.8rem, 2vw, 2.4rem);
            line-height: 1.1;
            font-weight: 700;
            color: #16263d;
            margin: 0;
        }

        .metric-subtext {
            margin-top: 0.5rem;
            margin-bottom: 0;
            color: var(--research-muted);
            font-size: 0.8rem;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0.7rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            line-height: 1;
        }

        .status-badge.completed {
            background: var(--research-success-soft);
            color: var(--research-success);
        }

        .status-badge.progress {
            background: var(--research-warning-soft);
            color: var(--research-warning);
        }

        .status-badge.neutral {
            background: #eef2f6;
            color: #4b5563;
        }

        .progress {
            height: 0.7rem;
            border-radius: 999px;
            background: #e7edf5;
            overflow: hidden;
        }

        .progress-bar {
            border-radius: 999px;
            background: linear-gradient(90deg, #2f7ef8 0%, #1e5ad5 100%);
        }

        .progress-bar.success {
            background: linear-gradient(90deg, #2ab57e 0%, #1f8a5d 100%);
        }

        .btn {
            border-radius: 0.8rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--research-primary);
            border-color: var(--research-primary);
        }

        .btn-primary:hover,
        .btn-primary:focus {
            background: #1858bc;
            border-color: #1858bc;
        }

        .btn-outline-primary {
            border-width: 1.6px;
        }

        .btn-outline-secondary {
            border-width: 1.6px;
        }

        .btn-link {
            color: var(--research-primary);
            font-weight: 600;
        }

        .empty-state {
            border: 1.5px dashed var(--research-border);
            background: #fbfdff;
            border-radius: 1.1rem;
            padding: 2rem 1.5rem;
            text-align: center;
        }

        .empty-state h3 {
            margin-bottom: 0.75rem;
        }

        .empty-state p {
            margin-bottom: 0;
        }

        .content-block {
            background: #fff;
            border: 1px solid var(--research-border);
            border-radius: 1rem;
            box-shadow: var(--research-shadow);
        }

        .content-block .card-body {
            padding: 1.5rem;
        }

        .workspace-sidebar .list-group-item {
            border-radius: 0.85rem;
            margin-bottom: 0.5rem;
            border: 1px solid transparent;
            padding: 0.8rem 0.9rem;
            font-weight: 600;
            color: #334155;
        }

        .workspace-sidebar .list-group-item.active {
            background: var(--research-primary-soft);
            border-color: #cfe0ff;
            color: var(--research-primary);
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.65rem;
        }

        .muted-copy {
            color: var(--research-muted);
        }

        .help-text {
            color: var(--research-muted);
            font-size: 0.85rem;
        }

        .form-control,
        .form-select {
            border-radius: 0.85rem;
            border: 1px solid var(--research-border);
            padding: 0.78rem 0.9rem;
            background: #fff;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: rgba(31, 100, 216, 0.6);
            box-shadow: 0 0 0 0.2rem rgba(31, 100, 216, 0.12);
        }

        .auth-shell {
            max-width: 540px;
            margin: 0 auto;
        }

        .alert {
            border-radius: 0.9rem;
        }

        @media (max-width: 767.98px) {
            .page-shell {
                padding-top: 1.3rem;
            }

            .card-body {
                padding: 1.15rem;
            }

            .page-header {
                align-items: flex-start;
            }

            .workspace-sidebar {
                margin-bottom: 1rem;
            }
        }
    </style>
</head>
<body class="bg-light">
    {% include 'navbar.html' %}
    <div class="container container-main page-shell">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('form[data-submit-text]').forEach((form) => {
                const btn = form.querySelector('button[type="submit"]');
                if (!btn) return;
                form.addEventListener('submit', () => {
                    btn.disabled = true;
                    const original = btn.dataset.originalText || btn.textContent;
                    btn.dataset.originalText = original;
                    btn.textContent = btn.dataset.submitText || 'Processing...';
                });
            });
        });
    </script>
</body>
</html>
