<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container container-main">

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarContent">
            {% if user.is_authenticated %}
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-lg-1">
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="{% url 'dashboard' %}">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'my_papers' %}active{% endif %}" href="{% url 'my_papers' %}">My Papers</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'upload_paper' %}active{% endif %}" href="{% url 'upload_paper' %}">Upload Paper</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-2 ms-auto">
                    <a class="btn btn-outline-light btn-sm" href="{% url 'change_password' %}">Change Password</a>
                    <a class="btn btn-light btn-sm" href="{% url 'logout' %}">Logout</a>
                </div>
            {% else %}
                <div class="ms-auto d-flex align-items-center gap-2">
